<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minetype | A copy of monkeytype but in minecraft theme :p</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/minecraft-4" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="app.js"></script>
</head>
<body>
    <div class="title">
        <div class="logo-container">
            <div class="main-title">
                <img src="minetype1.png" alt="MINETYPE LOGO" class="minetype">
                <div class="splash">FAN MADE</div>
            </div>
        </div>
    </div>

    <div class="home">
        <div class="menu-buttons">
            <div class="row">
                <a href="" class="mc-button">Singleplayer</a>
            </div>
            <div class="row">
                <a href="" class="mc-button">Multiplayer</a>
            </div>
            <div class="row">
            <a href="" class="mc-button">Minecraft Realms</a>
            </div>
            <div class="row">
                <a href="" class="mc-button">Options...</a>
                <a href="" class="mc-button">Quit Game</a>
            </div>
        </div>
    </div>
</body>
</html>
